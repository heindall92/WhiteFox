<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Vuln Scanner Lab · simulador estilo Nessus Essentials</title>
<style>:root{
 --bg:#eef1f5;--surface:#ffffff;--surface-2:#f6f8fa;--surface-3:#e9edf2;
 --text:#141c26;--text-2:#38434f;--text-3:#4a5562;
 --line:rgba(20,32,48,.10);--line-strong:rgba(20,32,48,.18);
 --ring:0 0 0 1px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06),0 6px 16px -6px rgba(16,24,40,.10);
 --ring-hi:0 0 0 1px rgba(16,24,40,.10),0 4px 10px rgba(16,24,40,.08),0 16px 32px -12px rgba(16,24,40,.18);
 --head:#13202d;--head-2:#1c2c3c;--head-text:#e9eef4;--head-dim:#b9c5d1;
 --side:#f7f9fb;--side-active:#e3ebf5;
 --primary:#1f6fc5;--primary-h:#195ea9;--primary-text:#ffffff;--primary-soft:#e4effb;--link:#155ba8;
 --ok:#2e7d32;--warn:#a65a00;--danger:#b3261e;
 --crit:#91243e;--high:#dd4b50;--med:#f18c43;--low:#f8c851;--info:#67ace1;
 --crit-t:#ffffff;--high-t:#ffffff;--med-t:#1d1206;--low-t:#1d1606;--info-t:#071a2a;
 --focus:0 0 0 3px rgba(31,111,197,.35);
 --r:10px;--r-sm:7px;--r-lg:14px;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
 color-scheme:light;
}
[data-theme=dark]{
 --bg:#0f141a;--surface:#171e26;--surface-2:#1c242e;--surface-3:#232d39;
 --text:#eef2f6;--text-2:#c9d2dc;--text-3:#b4bfcb;
 --line:rgba(220,230,240,.10);--line-strong:rgba(220,230,240,.18);
 --ring:0 0 0 1px rgba(255,255,255,.07),0 1px 2px rgba(0,0,0,.4),0 8px 20px -8px rgba(0,0,0,.5);
 --ring-hi:0 0 0 1px rgba(255,255,255,.10),0 8px 24px rgba(0,0,0,.45);
 --head:#0a1119;--head-2:#121c27;--side:#131a22;--side-active:#1f2c3b;
 --primary:#4a97e8;--primary-h:#62a6ee;--primary-text:#061322;--primary-soft:#16263a;--link:#8cc0f5;
 --ok:#7ccf80;--warn:#f0b35a;--danger:#ff8a80;
 --focus:0 0 0 3px rgba(74,151,232,.45);
 color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3,h4{margin:0;line-height:1.25;text-wrap:balance;font-weight:600}
p{text-wrap:pretty}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num,.tab .count{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}

/* Layout */
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
.topbar{display:flex;align-items:center;gap:6px;background:var(--head);color:var(--head-text);height:54px;padding:0 14px 0 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:22px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(140deg,#2c8be0,#1a4f8a);display:grid;place-items:center;color:#fff}
.brand small{display:block;font-weight:500;color:var(--head-dim);font-size:11px;letter-spacing:.3px}
.topnav{display:flex;height:100%}
.topnav button{background:none;border:0;color:var(--head-dim);padding:0 16px;height:100%;cursor:pointer;font-weight:550;position:relative;transition:color .15s}
.topnav button:hover{color:#fff}
.topnav button[aria-current=true]{color:#fff}
.topnav button[aria-current=true]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#4a97e8}
.topbar .spacer{flex:1}
.iconbtn{background:none;border:0;color:var(--head-dim);width:40px;height:40px;border-radius:9px;display:grid;place-items:center;cursor:pointer;transition:background-color .15s,color .15s}
.iconbtn:hover{background:var(--head-2);color:#fff}
.trainbtn{display:flex;align-items:center;gap:8px;background:var(--head-2);color:#fff;border:0;border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:550;box-shadow:0 0 0 1px rgba(255,255,255,.08);transition:background-color .15s}
.trainbtn:hover{background:#243649}
.trainbtn .pill{background:#2c8be0;color:#fff;border-radius:20px;padding:0 8px;font-size:12px}
.user{display:flex;align-items:center;gap:8px;color:var(--head-dim);font-size:13px;margin-left:6px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2a3c50;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.disclaimer{background:var(--surface-3);color:var(--text-2);font-size:12px;padding:5px 16px;display:flex;gap:8px;align-items:center}
.body{display:grid;grid-template-columns:232px 1fr;min-height:0}
.side{background:var(--side);padding:18px 10px;overflow:auto;box-shadow:1px 0 0 var(--line)}
.side h6{margin:16px 10px 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:650}
.side h6:first-child{margin-top:0}
.side button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:9px 10px;border-radius:8px;color:var(--text-2);cursor:pointer;text-align:left;font-weight:500;transition:background-color .15s,color .15s}
.side button:hover{background:var(--surface-3);color:var(--text)}
.side button[aria-current=true]{background:var(--side-active);color:var(--text);font-weight:600}
.side button .count{margin-left:auto;font-size:12px;color:var(--text-3)}
.side .community{margin:22px 6px 0;padding:12px;border-radius:var(--r);background:var(--surface);box-shadow:var(--ring);font-size:12.5px;color:var(--text-2)}
.side .community b{color:var(--text)}
.meter{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.meter>i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .3s}
main{overflow:auto;padding:22px 26px 60px;min-width:0}

/* Page header */
.ph{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px}
.ph .crumb{font-size:12.5px;color:var(--text-3);margin-bottom:4px}
.ph .crumb a{cursor:pointer;text-decoration:none}
.ph .crumb a:hover{text-decoration:underline}
.ph .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:8px;padding:8px 14px;min-height:36px;cursor:pointer;font-weight:550;background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line-strong),0 1px 2px rgba(16,24,40,.05);transition:background-color .15s,box-shadow .15s,scale .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:active{scale:.96}
.btn.primary{background:var(--primary);color:var(--primary-text);box-shadow:0 1px 2px rgba(16,24,40,.15)}
.btn.primary:hover{background:var(--primary-h)}
.btn.ghost{background:none;box-shadow:none;color:var(--link)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dd{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--surface);border-radius:var(--r);box-shadow:var(--ring-hi);padding:6px;z-index:40;display:none}
.menu.open{display:block;animation:pop .14s ease-out}
.menu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* Cards / tables */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--ring)}
.card.pad{padding:18px 20px}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:8px;padding:0 10px;box-shadow:inset 0 0 0 1px var(--line);min-width:240px;height:36px}
.search input{border:0;background:none;outline:none;width:100%;height:100%}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--primary),var(--focus)}
table.t{width:100%;border-collapse:collapse}
.t th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);font-weight:650;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.t th.sort{cursor:pointer}
.t th.sort:hover{color:var(--text)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer;transition:background-color .12s}
.t tbody tr.click:hover{background:var(--surface-2)}
.t td.muted,.muted{color:var(--text-2)}
.t td.name{font-weight:550}
.empty{padding:40px;text-align:center;color:var(--text-2)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:20px;padding:2px 9px;background:var(--surface-3);color:var(--text-2);font-weight:550;white-space:nowrap}
.tag.ok{background:rgba(46,125,50,.14);color:var(--ok)}
.tag.run{background:var(--primary-soft);color:var(--link)}
.tag.warn{background:rgba(166,90,0,.14);color:var(--warn)}

/* Severity */
.sev{display:inline-flex;align-items:center;justify-content:center;min-width:74px;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:650;letter-spacing:.2px}
.sev.critical{background:var(--crit);color:var(--crit-t)}.sev.high{background:var(--high);color:var(--high-t)}
.sev.medium{background:var(--med);color:var(--med-t)}.sev.low{background:var(--low);color:var(--low-t)}.sev.info{background:var(--info);color:var(--info-t)}
.sev.mixed{background:linear-gradient(90deg,var(--crit),var(--high));color:#fff}
.recast{font-size:11px;color:var(--text-3);margin-left:6px}
.bar{display:flex;height:22px;border-radius:5px;overflow:hidden;min-width:240px;background:var(--surface-3)}
.bar span{display:grid;place-items:center;font-size:11.5px;font-weight:650;min-width:0}
.bar .critical{background:var(--crit);color:#fff}.bar .high{background:var(--high);color:#fff}.bar .medium{background:var(--med);color:var(--med-t)}.bar .low{background:var(--low);color:var(--low-t)}.bar .info{background:var(--info);color:var(--info-t)}
.vpr{font-weight:650;font-variant-numeric:tabular-nums}
.chip-ex{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--danger);font-weight:600}

/* Results layout */
.results{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:12px 12px 11px;cursor:pointer;color:var(--text-2);font-weight:550;position:relative;display:flex;gap:7px;align-items:center;transition:color .15s}
.tab:hover{color:var(--text)}
.tab[aria-selected=true]{color:var(--text)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}
.tab .count{background:var(--surface-3);border-radius:20px;padding:0 7px;font-size:12px;color:var(--text-2)}
.details dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
.details dt{color:var(--text-2)}
.details dd{margin:0;font-weight:550;word-break:break-word}
.details h3{font-size:14px;margin-bottom:10px}
.donutwrap{display:flex;align-items:center;gap:16px;margin-top:6px}
.legend{display:grid;gap:4px;font-size:12.5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.side-stack{display:grid;gap:14px}

/* Plugin detail */
.pd{display:grid;grid-template-columns:1fr 320px;gap:18px;align-items:start}
.pd section{margin-bottom:18px}
.pd h4{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-3);margin-bottom:6px}
.pd pre{font:12.5px/1.5 var(--mono);background:var(--surface-2);padding:12px 14px;border-radius:9px;white-space:pre-wrap;margin:6px 0 0;box-shadow:inset 0 0 0 1px var(--line)}
.out-h{font-size:12.5px;color:var(--text-2);margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.out-h b{color:var(--text)}
.note{background:var(--primary-soft);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--text)}
.note b{color:var(--link)}

/* Forms */
.form{display:grid;gap:14px;max-width:720px}
.field{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:start}
.field>label{padding-top:8px;font-weight:550;color:var(--text-2)}
.field .hint{font-size:12.5px;color:var(--text-2);margin-top:4px}
.in,select.in,textarea.in{width:100%;background:var(--surface);border:0;border-radius:8px;padding:8px 10px;min-height:36px;box-shadow:inset 0 0 0 1px var(--line-strong);transition:box-shadow .15s}
.in:focus{outline:none;box-shadow:inset 0 0 0 1px var(--primary),var(--focus)}
textarea.in{min-height:80px;resize:vertical;font-family:var(--mono);font-size:13px}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0}
.check input{width:16px;height:16px;accent-color:var(--primary)}
.editor{display:grid;grid-template-columns:200px 1fr;gap:0;min-height:460px}
.enav{padding:14px 10px;box-shadow:1px 0 0 var(--line)}
.enav h6{margin:12px 8px 4px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3)}
.enav button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--text-2);font-weight:500}
.enav button:hover{background:var(--surface-2)}
.enav button[aria-current=true]{background:var(--side-active);color:var(--text);font-weight:600}
.epane{padding:20px 24px}
.epane h3{font-size:16px;margin-bottom:14px}
.subtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line)}
.err{color:var(--danger);font-size:13px;margin-top:6px}

/* Templates */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tcard{background:var(--surface);border:0;border-radius:var(--r-lg);box-shadow:var(--ring);padding:18px 16px;text-align:left;cursor:pointer;display:grid;gap:8px;transition:box-shadow .18s,transform .18s}
.tcard:hover{box-shadow:var(--ring-hi);transform:translateY(-1px)}
.tcard .ti{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--link);display:grid;place-items:center}
.tcard .ti svg.i{width:24px;height:24px}
.tcard b{font-size:14.5px}
.tcard p{margin:0;font-size:12.5px;color:var(--text-2)}
.tcard.locked{cursor:not-allowed;opacity:.62}
.tcard .lock{font-size:11px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sect-t{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-3);margin:20px 0 10px;font-weight:650}

/* Progress */
.prog{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;width:120px;display:inline-block;vertical-align:middle;margin-right:8px}
.prog i{display:block;height:100%;background:var(--primary);transition:width .4s linear}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,22,.45);display:grid;place-items:center;z-index:60;animation:fade .15s ease-out}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--ring-hi);width:min(560px,92vw);max-height:88vh;overflow:auto}
.modal header{padding:18px 22px 4px;display:flex;align-items:center}
.modal header h2{font-size:17px}
.modal .mb{padding:14px 22px}
.modal footer{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px}
.modal .field{grid-template-columns:150px 1fr}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Training drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,96vw);background:var(--surface);box-shadow:var(--ring-hi);z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s cubic-bezier(.2,0,0,1)}
.drawer.open{transform:none}
.drawer header{padding:16px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 var(--line)}
.drawer header h2{font-size:16px}
.drawer .db{overflow:auto;padding:16px 18px 40px;flex:1}
.ex-list{display:grid;gap:8px}
.ex{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:0;border-radius:12px;box-shadow:var(--ring);padding:12px 14px;cursor:pointer;text-align:left;width:100%;transition:box-shadow .15s}
.ex:hover{box-shadow:var(--ring-hi)}
.ex .n{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-weight:650;font-size:12.5px;flex:none;color:var(--text-2)}
.ex.done .n{background:var(--ok);color:#fff}
.ex .lvl{font-size:11.5px;color:var(--text-2);font-weight:600}
.ex b{display:block;font-size:14px}
.st{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--surface-2);font-size:13px;margin:6px 0}
.st.ok{background:rgba(46,125,50,.13);color:var(--ok);font-weight:600}
.quiz{display:grid;gap:6px;margin-top:8px}
.quiz label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line-strong);cursor:pointer}
.quiz label:hover{background:var(--surface-2)}
.quiz label.right{box-shadow:inset 0 0 0 2px var(--ok)}
.quiz label.wrong{box-shadow:inset 0 0 0 2px var(--danger)}
.quiz input{margin-top:3px;accent-color:var(--primary)}
.steps{margin:6px 0 0;padding-left:20px;color:var(--text-2)}
.steps li{margin:3px 0}
details.hint{background:var(--surface-2);border-radius:9px;padding:8px 12px;margin:6px 0}
details.hint summary{cursor:pointer;font-weight:600}
.ovprog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ovprog .meter{flex:1;margin:0;height:8px}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:80;pointer-events:none}
.toast{background:var(--head);color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--ring-hi);z-index:80;font-size:13.5px;animation:pop .18s ease-out;display:flex;gap:8px;align-items:center}
.filters{padding:12px 14px;display:grid;gap:8px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--line),inset 0 -1px 0 var(--line)}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow select,.frow input{width:auto;min-width:150px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:14px 16px}
.stat b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
.stat span{color:var(--text-2);font-size:12.5px}
@media (max-width:1100px){.results,.pd{grid-template-columns:1fr}.body{grid-template-columns:64px 1fr}.side h6,.side .lbl,.side .count,.side .community{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <header class="topbar" id="top"></header>
 <div class="disclaimer" role="note"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>Herramienta de estudio no oficial, sin afiliación con Tenable. Funciona 100% offline: sin conexiones, sin telemetría. Hosts y hallazgos ficticios de laboratorio.</div>
 <div class="body"><nav class="side" id="side" aria-label="Sidebar"></nav><main id="main"></main></div>
</div>
<aside class="drawer" id="drawer" aria-label="Entrenamiento"></aside>
<div id="modal"></div>
<script>"use strict";
/* ===== Datos del laboratorio (ficticios / representativos) ===== */
const SEV = ['Info','Low','Medium','High','Critical'];
const SEVKEY = ['info','low','medium','high','critical'];
const CRED = { ssh:{user:'auditor',pass:'Lab2026!'}, win:{user:'svc_nessus',pass:'Lab2026!',domain:'LAB'} };

/* Catálogo de plugins. IDs, puntuaciones y textos son representativos para estudio. */

const ipToN=ip=>ip.split('.').reduce((a,b)=>a*256+(+b),0);
const nToIp=n=>[n>>>24&255,n>>>16&255,n>>>8&255,n&255].join('.');
const isIp=s=>/^(\d{1,3}\.){3}\d{1,3}$/.test(s)&&s.split('.').every(x=>+x<=255);
function parseTargets(txt){
 const toks=String(txt||'').split(/[\s,;]+/).filter(Boolean);const ips=new Set();const errors=[];
 for(const t of toks){
  let m;
  if(isIp(t)){ips.add(t);continue;}
  if((m=t.match(/^((?:\d{1,3}\.){3}\d{1,3})\/(\d{1,2})$/))&&isIp(m[1])&&+m[2]>=16&&+m[2]<=32){
   const bits=+m[2],base=ipToN(m[1])&(bits===0?0:(~0<<(32-bits))>>>0),size=2**(32-bits);
   for(let i=0;i<size;i++){const n=(base+i)>>>0;if(size>2&&(i===0||i===size-1))continue;ips.add(nToIp(n));}continue;}
  if((m=t.match(/^((?:\d{1,3}\.){3})(\d{1,3})-(\d{1,3})$/))&&+m[2]<=+m[3]&&+m[3]<=255){for(let i=+m[2];i<=+m[3];i++)ips.add(m[1]+i);continue;}
  if((m=t.match(/^((?:\d{1,3}\.){3}\d{1,3})-((?:\d{1,3}\.){3}\d{1,3})$/))&&isIp(m[1])&&isIp(m[2])){const a=ipToN(m[1]),b=ipToN(m[2]);if(b>=a&&b-a<65536){for(let n=a;n<=b;n++)ips.add(nToIp(n));continue;}}
  const h=HOSTS.find(h=>h.fqdn===t.toLowerCase()||h.fqdn.split('.')[0]===t.toLowerCase());
  if(h){ips.add(h.ip);continue;}
  errors.push(t);
 }
 return{ips:[...ips],errors};
}

function credStatus(scan,kind){
 const c=scan.creds||defaultCreds();
 if(kind==='linux'){const s=c.ssh;if(!s.user)return'none';return(s.method==='password'&&s.user===CRED.ssh.user&&s.pass===CRED.ssh.pass)?'ok':'fail';}

 return'none';
}
function genResults(scan,ips){
 const t=scan.template,st=scan.settings,hosts=[];
 const alive=HOSTS.filter(h=>ips.includes(h.ip));
 for(const h of alive){
  const items=[],add=(pid,port,out)=>{if(!PLUGINS[pid])return;if(t==='advanced'&&st.families&&st.families[PLUGINS[pid].family]===false)return;items.push({pid,port,out:out??OUTPUTS[pid]??''});};
  const allPorts=st.discovery==='all';
  const ports=h.ports.concat(allPorts&&h.extraPorts?h.extraPorts:[]);
  add(10180,'0/icmp','\nThe remote host is up\nThe host replied to an ARP who-is query.\n');
  if(t==='discovery'){
   ports.forEach(p=>add(11219,p,'\nPort '+p.split('/')[0]+'/'+p.split('/')[1]+' was found to be open\n'));
   if(st.discovery==='osid'||st.discovery==='hostenum')add(11936,'0/tcp','\nRemote operating system : '+h.os+'\nConfidence level : 95\nMethod : MLSinFP\n');
   add(19506,'0/tcp',scanInfo(scan,h,'none'));
   hosts.push(mkHost(h,items));continue;
  }
  const cs=credStatus(scan,h.kind);
  const credOk=cs==='ok';
  if(t!=='patch'){
   ports.forEach(p=>add(11219,p,'\nPort '+p+' was found to be open\n'));
   add(22964,ports[0]);add(11936,'0/tcp','\nRemote operating system : '+h.os+'\nConfidence level : '+(credOk?100:95)+'\nMethod : '+(credOk?'LinuxDistribution / SMB':'MLSinFP')+'\n');
   add(10287,'0/udp','\nFor your information, here is the traceroute from 192.168.56.5 to '+h.ip+' :\n192.168.56.5\n'+h.ip+'\n');
   add(45590,'0/tcp');add(25220,'0/tcp');
  }
  for(const [cond,pid,port] of h.f){
   const p=PLUGINS[pid];
   if(t==='patch'){if(cond==='local'&&credOk)add(pid,port);continue;}
   if(t==='webapp'){const webFam=['Web Servers','CGI abuses','CGI abuses : XSS','General','Service detection'];
     if(cond==='web'||(cond==='net'&&webFam.includes(p.family)))add(pid,port);continue;}
   if(cond==='net')add(pid,port);
   else if(cond==='banner'){if(!credOk&&!(st.accuracy==='avoid'&&p.paranoid))add(pid,port);}
   else if(cond==='local'){if(credOk)add(pid,port);}
   else if(cond==='web'){if(st.assessment!=='default')add(pid,port);}
   else if(cond==='allports'){if(allPorts)add(pid,port);}
  }
  if(h.kind!=='device'){
   if(cs==='ok'){add(141118,h.kind==='windows'?'445/tcp':'22/tcp','\nCredential validated for '+(h.kind==='windows'?'SMB : '+scan.creds.win.user:'SSH : '+scan.creds.ssh.user)+'\nLocal checks were enabled.\n');add(117887,'0/tcp');add(h.kind==='windows'?178102:22869,'0/tcp');}
   else if(cs==='fail')add(104410,h.kind==='windows'?'445/tcp':'22/tcp','\nNessus was unable to log into the target via '+(h.kind==='windows'?'SMB':'SSH')+' (authentication failure).\nCheck the username / password / domain.\n');
   else add(110723,'0/tcp','\nSSH and/or SMB was detected on port '+(h.kind==='windows'?'445':'22')+'.\nNo credentials were provided.\n');
  }
  add(19506,'0/tcp',scanInfo(scan,h,cs));
  hosts.push(mkHost(h,items,cs));
 }
 return hosts;
}

function fOps(f){if(['vpr','cvss'].includes(f))return[['gt','is more than'],['lt','is less than'],['eq','is equal to']];if(['name','cve'].includes(f))return[['contains','contains'],['ncontains','does not contain']];return[['eq','is equal to'],['neq','is not equal to']];}
function fMatch(x,f){
 const p=x.p;let v;
 switch(f.field){
  case'sev':v=x.sev===+f.value;break;case'family':v=p.family===f.value;break;case'pid':v=String(p.id)===String(f.value).trim();break;
  case'host':v=x.h.ip===String(f.value).trim();break;case'exploit':v=String(!!p.exploit)===f.value;break;
  case'name':v=p.name.toLowerCase().includes(String(f.value).toLowerCase());break;
  case'cve':v=(p.cve||[]).some(c=>c.toLowerCase().includes(String(f.value).toLowerCase()));break;
  case'vpr':case'cvss':{const n=f.field==='vpr'?p.vpr:p.cvss;if(n==null)return false;const t=parseFloat(f.value);
   if(f.op==='gt')return n>t;if(f.op==='lt')return n<t;return n===t;}
 }
 if(f.op==='neq'||f.op==='ncontains')return!v;return v;
}
function applyFilters(items){
 let r=items;const fs=UI.filters.filter(f=>f.value!==''&&f.value!=null);
 if(fs.length)r=r.filter(x=>UI.match==='all'?fs.every(f=>fMatch(x,f)):fs.some(f=>fMatch(x,f)));
 const q=UI.search.trim().toLowerCase();
 if(q)r=r.filter(x=>x.p.name.toLowerCase().includes(q)||String(x.p.id).includes(q)||(x.p.cve||[]).join(' ').toLowerCase().includes(q)||x.h.ip.includes(q));
 return r;
}
function groupKey(p){
 if(/^SSL|^TLS/.test(p.name))return'SSL (Multiple Issues)';
 if(/^SSH /.test(p.name))return'SSH (Multiple Issues)';
 if(/^Apache 2\.4/.test(p.name))return'Apache HTTP Server (Multiple Issues)';
 if(/^Target Credential Status|^OS Security Patch/.test(p.name))return'Credentialed Checks (Multiple Issues)';
 if(/^Microsoft Windows (SMB|Remote)|^Server Message Block/.test(p.name))return'Microsoft Windows (Multiple Issues)';
 return null;
}
function aggregate(items){
 const m=new Map();
 for(const x of items){let a=m.get(x.p.id);if(!a){a={p:x.p,sev:x.sev,count:0,hosts:new Set(),recast:false};m.set(x.p.id,a);}

function donut(c,size=120){
 const tot=c.reduce((a,b)=>a+b,0);const R=size/2-12,C=2*Math.PI*R;let off=0;
 const cols=['var(--info)','var(--low)','var(--med)','var(--high)','var(--crit)'];
 let segs='';if(tot){for(let i=4;i>=0;i--){if(!c[i])continue;const len=c[i]/tot*C;segs+=`<circle r="${R}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${cols[i]}" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size/2} ${size/2})"/>`;off+=len;}}
 else segs=`<circle r="${R}" cx="${size/2}" cy="${size/2}" fill="none" stroke="var(--surface-3)" stroke-width="18"/>`;
 return`<div class="donutwrap"><svg width="${size}" height="${size}" role="img" aria-label="Vulnerabilities by severity">${segs}<text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="18" font-weight="650" fill="currentColor">${tot}</text></svg>
 <div class="legend">${[4,3,2,1,0].map(i=>`<div><i style="background:${cols[i]}"></i>${SEV[i]} <b class="num">${c[i]}</b></div>`).join('')}</div></div>`;
}

 if(pt.errors.length){d.err='Invalid target(s): '+pt.errors.join(', ');d.sec='general';d.top='settings';render();return;}

/* ===== Ejecución simulada ===== */
function launch(id,custom){
 const s=S.scans.find(x=>x.id===id);const pt=parseTargets(custom||s.settings.targets);
 if(pt.errors.length||!pt.ips.length){modal('Unable to launch',`<p>Invalid targets: ${esc(pt.errors.join(', ')||'(empty)')}</p>`);return;}
 if(s.template!=='discovery'&&pt.ips.length>16){
  ev('licenseBlocked');
  modal('License limit exceeded',`<p><b>${pt.ips.length}</b> targets requested. Your Nessus Essentials license allows scanning up to <b>16 IP addresses</b>.</p><div class="note"><b>Consejo:</b> los escaneos de <b>Host Discovery</b> no consumen licencia. Primero descubre qué hosts están vivos y después lanza el escaneo de vulnerabilidades solo contra esas IPs (p. ej. <code>192.168.56.10, 192.168.56.20, 192.168.56.30</code>).</div>`);return;}
 const r=S.scans.find(x=>x.id===id).runs.find(r=>r.status==='running'||r.status==='paused');if(r){toast('Scan already running','info');return;}
 const hosts=genResults(s,pt.ips);
 const alive=hosts.length,base=s.template==='discovery'?5:4+alive*1.1;
 const run={id:uid(),start:Date.now(),end:null,status:'running',progress:0,dur:base,simMs:(s.template==='discovery'?2:6+alive*3.5)*60000*(s.settings.discovery==='all'?2.2:1),ips:pt.ips.length,hosts,custom:!!custom,
  cred:{ssh:s.creds.ssh.user?credStatus(s,'linux'):'none',win:s.creds.win.user?credStatus(s,'windows'):'none'}};
 s.runs.push(run);s.cur=run.id;s.mod=Date.now();save();toast('Scan launched: '+esc(s.name),'play');render();
}
function pauseScan(id){const r=curRun(S.scans.find(x=>x.id===id));if(!r)return;r.status=r.status==='paused'?'running':'paused';save();render();}
function stopScan(id){const s=S.scans.find(x=>x.id===id),r=curRun(s);if(!r)return;r.status='canceled';r.end=Date.now();r.hosts=visibleHosts(r);r.progress=100;save();toast('Scan canceled','stop');render();}
setInterval(()=>{
 let changed=false,finished=false;
 for(const s of S.scans)for(const r of s.runs){
  if(r.status!=='running')continue;changed=true;
  r.progress=Math.min(100,r.progress+100*(0.25/r.dur)*(S.speed||2)/2);
  if(r.progress>=100){r.status='completed';r.end=r.start+r.simMs;r.realEnd=Date.now();finished=true;toast('Scan completed: '+esc(s.name));
   if(s.template==='discovery')ev('discoveryDone');}
 }
 if(!changed)return;
 if(finished){save();render();checkExercises();return;}
 const ae=document.activeElement;const typing=ae&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName);
 document.querySelectorAll('[data-prog]').forEach(el=>{const s=S.scans.find(x=>x.id===+el.dataset.prog);const r=curRun(s);if(r)el.style.width=r.progress+'%';});
 if(!typing&&S.view.page==='scan')render();
},250);

/* ===== Vista de resultados ===== */
function vScan(){
 const s=curScan();if(!s){S.view.page='scans';return vScans();}
 const run=runView(curRun(s));const v=S.view;
 const items=effItems(run);const fitems=applyFilters(items);
 if(v.plugin)return vPlugin(s,run,items);
 const running=run&&(run.status==='running'||run.status==='paused');
 const hostsN=run?run.hosts.length:0,vulnsN=aggregate(fitems).length,rems=remediations(fitems);
 const tab=v.tab||'hosts';
 const tabs=[['hosts','Hosts',hostsN],['vulns','Vulnerabilities',vulnsN],['rem','Remediations',rems.length],['notes','Notes',notes(s,run).length],['history','History',s.runs.length]];
 let body='';
 if(!run)body=`<div class="empty">This scan has not been run yet. <button class="btn primary sm" onclick="launch(${s.id})">${ic('play','sm')}Launch</button></div>`;
 else if(v.host)body=vHostDetail(s,run,fitems);
 else if(tab==='hosts')body=vHosts(s,run,fitems);
 else if(tab==='vulns')body=vVulns(s,run,fitems);
 else if(tab==='rem')body=vRem(rems,fitems,run);
 else if(tab==='notes')body=`<div class="mb" style="padding:16px 18px">${notes(s,run).map(n=>`<div class="st">${ic('info','sm')}<span>${n}</span></div>`).join('')||'<div class="empty">No notes.</div>'}</div>`;
 else if(tab==='history')body=vHistory(s);
 const act=running?`<button class="btn" onclick="pauseScan(${s.id})">${ic(run.status==='paused'?'play':'pause','sm')}${run.status==='paused'?'Resume':'Pause'}</button><button class="btn" onclick="stopScan(${s.id})">${ic('stop','sm')}Stop</button>`:
  dd('m-launch',ic('play','sm')+'Launch',[['Default',`launch(${s.id})`],['Custom Targets',`customTargets(${s.id})`]]);
 const filterBar=(tab==='vulns'||tab==='hosts'||tab==='rem')&&run&&!v.host?filterUI():'';
 return`<div class="ph"><div><div class="crumb"><a onclick="go({page:'scans'})">${ic('chevL','sm')} Back to My Scans</a>${v.host?` / <a onclick="S.view.host=null;render()">${esc(s.name)}</a>`:''}</div><h1>${v.host?esc(v.host):esc(s.name)}</h1></div>
 <div class="actions"><button class="btn" onclick="editScan(${s.id})">${ic('gear','sm')}Configure</button><button class="btn" onclick="auditTrail(${s.id})">Audit Trail</button>${act}
 <button class="btn" ${run&&!running?'':'disabled'} onclick="reportModal(${s.id})">${ic('file','sm')}Report</button>${dd('m-export','Export',[['Nessus',`exportNessus(${s.id})`],['CSV',`reportModal(${s.id},'csv')`]])}</div></div>

 if(UI.groups){const gm=new Map(),out=[];for(const r of rows){const g=groupKey(r.p);if(!g){out.push(r);continue;}if(!gm.has(g))gm.set(g,[]);gm.get(g).push(r);}
  for(const [g,list] of gm){if(list.length===1){out.push(list[0]);continue;}const sevs=new Set(list.map(r=>r.sev));out.push({group:g,name:g,family:[...new Set(list.map(r=>r.p.family))].length===1?list[0].p.family:'Mixed',sev:Math.max(...list.map(r=>r.sev)),mixed:sevs.size>1,count:list.reduce((a,r)=>a+r.count,0),n:list.length,vpr:Math.max(...list.map(r=>r.p.vpr??-1)),cvss:Math.max(...list.map(r=>r.p.cvss??-1)),epss:null});}
  rows=out;}
 return`<div class="toolbar" style="padding-top:4px"><span class="muted">${rows.length} rows</span><span style="margin-left:auto"></span><button class="btn sm" onclick="UI.groups=!UI.groups;render()">${UI.groups?'Disable Groups':'Enable Groups'}</button></div>${vulnTable(sortRows(rows),true)}`;

/* Remediaciones */
function remediations(items){const m=new Map();items.forEach(x=>{if(!x.p.rem||x.sev===0)return;let r=m.get(x.p.rem);if(!r){r={action:x.p.rem,pl:new Set(),hosts:new Set(),max:0,vpr:0};m.set(x.p.rem,r);}r.pl.add(x.p.id+'|'+x.h.ip);r.hosts.add(x.h.ip);r.max=Math.max(r.max,x.sev);r.vpr=Math.max(r.vpr,x.p.vpr||0);});
 return[...m.values()].sort((a,b)=>b.pl.size-a.pl.size||b.max-a.max);}
function vRem(rems,items,run){
 const tot=items.filter(x=>x.sev>0).length;const cov=rems.slice(0,10).reduce((a,r)=>a+r.pl.size,0);
 if(!rems.length)return'<div class="empty">No remediations available.</div>';
 return`<div class="toolbar"><span class="muted">Taking the following actions across <b>${run.hosts.length}</b> hosts would resolve <b>${tot?Math.round(cov/tot*100):0}%</b> of the vulnerabilities on the network.</span></div>
 <table class="t"><thead><tr><th>Action to take</th><th>Max Sev</th><th class="num">Vulns</th><th class="num">Hosts</th></tr></thead><tbody>${rems.map(r=>`<tr><td class="name">${esc(r.action)}</td><td>${sevTag(r.max)}</td><td class="num">${r.pl.size}</td><td class="num">${r.hosts.size}</td></tr>`).join('')}</tbody></table>`;
}

/* ===== Modales ===== */
function modal(title,body,footer){

}
function closeModal(){document.getElementById('modal').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal').innerHTML)closeModal();else toggleDrawer(false);}});
function customTargets(id){modal('Custom Targets',`<p class="muted">Lanza el escaneo una vez contra otros objetivos sin cambiar su configuración.</p><textarea class="in" id="ct" placeholder="192.168.56.30"></textarea>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="const v=document.getElementById('ct').value;closeModal();launch(${id},v)">Launch</button>`);}
function auditTrail(id){const s=S.scans.find(x=>x.id===id);const run=curRun(s);
 modal('Audit Trail',`<p class="muted">Explica por qué un plugin NO se reportó en un host. Escribe un Plugin ID y una IP.</p><div class="form"><div class="field"><label>Plugin ID</label><input class="in" id="at-p" placeholder="179072"></div><div class="field"><label>Host</label><input class="in" id="at-h" placeholder="192.168.56.30"></div></div><div id="at-r" style="margin-top:10px"></div>`,
 `<button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="auditRun(${id})">Search</button>`);}
function auditRun(id){const s=S.scans.find(x=>x.id===id),run=curRun(s);const pid=+document.getElementById('at-p').value,ip=document.getElementById('at-h').value.trim();const out=document.getElementById('at-r');
 const p=PLUGINS[pid];if(!p){out.innerHTML='<div class="st">Unknown plugin ID in this lab.</div>';return;}
 const h=run&&run.hosts.find(x=>x.ip===ip);if(!h){out.innerHTML='<div class="st">Host not scanned in the current run.</div>';return;}
 if(h.items.some(i=>i.pid===pid)){out.innerHTML='<div class="st ok">The plugin reported a result for this host.</div>';return;}
 const lab=HOSTS.find(x=>x.ip===ip),f=lab&&lab.f.find(x=>x[1]===pid);let why='The host does not appear to be affected (the service or software is not present).';
 if(f){if(f[0]==='local')why=h.cred==='ok'?'Disabled family or template excludes local checks.':'Local check skipped: no valid credentials for this host.';
  else if(f[0]==='banner')why=h.cred==='ok'?'Credentialed check confirmed the installed package is patched (backported fix): the banner-based version check is not reported.':'Accuracy setting "Avoid potential false alarms" suppressed a banner-only check.';
  else if(f[0]==='web')why='Web application tests disabled (Assessment: Default).';else if(f[0]==='allports')why='Port not scanned: Discovery is set to common ports.';else why='Plugin excluded by template or disabled plugin family.';}
 out.innerHTML=`<div class="st">${ic('info','sm')}<span>${esc(why)}</span></div>`;ev('auditTrail');}

 const r=rid?S.rules.find(x=>x.id===rid):{host:host||'',pid:pid||'',exp:'',sev:'hide'};
 modal(rid?'Edit Rule':'New Rule',`<div class="form"><div class="field"><label>Host</label><div><input class="in" id="r-h" value="${esc(r.host)}" placeholder="(todos los hosts)"><div class="hint">Vacío = se aplica a todos los hosts.</div></div></div>

 <div class="field"><label>Severity</label><select class="in" id="r-s">${[['hide','Hide this result'],['4','Critical'],['3','High'],['2','Medium'],['1','Low'],['0','Info']].map(([v,l])=>`<option value="${v}" ${String(r.sev)===v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="field"><label>Comentario (lab)</label><input class="in" id="r-c" value="${esc(r.comment||'')}" placeholder="Justificación / ticket / aprobador"></div></div><div id="r-err" class="err"></div>`,
 `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRule(${rid||0})">Save</button>`);}
function saveRule(rid){
 const host=document.getElementById('r-h').value.trim(),pid=+document.getElementById('r-p').value,exp=document.getElementById('r-e').value,sev=document.getElementById('r-s').value,comment=document.getElementById('r-c').value;
 if(!PLUGINS[pid]){document.getElementById('r-err').textContent='Plugin ID not found in this lab.';return;}
 if(host&&!isIp(host)){document.getElementById('r-err').textContent='Host must be an IP address.';return;}
 if(rid)Object.assign(S.rules.find(x=>x.id===rid),{host,pid,exp,sev,comment});else S.rules.push({id:uid(),host,pid,exp,sev,comment,created:Date.now()});
 save();closeModal();toast('Plugin rule saved');checkExercises();render();}
function vRules(){
 return`<div class="ph"><div><h1>Plugin Rules</h1><div class="muted" style="margin-top:4px">Cambian la severidad u ocultan resultados después del escaneo (aceptación de riesgo / falsos positivos). No afectan a la exportación .nessus.</div></div><div class="actions"><button class="btn primary" onclick="ruleModal()">${ic('plus')}New Rule</button></div></div>
 <div class="card">${S.rules.length?`<table class="t"><thead><tr><th>Host</th><th>Plugin ID</th><th>Plugin Name</th><th>Expiration Date</th><th>Severity</th><th></th></tr></thead><tbody>${S.rules.map(r=>{const exp=r.exp&&r.exp<today();return`<tr class="click" onclick="ruleModal(${r.id})"><td>${esc(r.host||'All Hosts')}</td><td class="num">${r.pid}</td><td>${esc(PLUGINS[r.pid].name)}<div class="muted" style="font-size:12.5px">${esc(r.comment||'')}</div></td><td>${r.exp||'Never'} ${exp?'<span class="tag warn">Expired</span>':''}</td><td>${r.sev==='hide'?'<span class="tag">Hidden</span>':sevTag(+r.sev)}</td><td style="text-align:right" onclick="event.stopPropagation()"><button class="btn sm" aria-label="Delete rule" onclick="S.rules=S.rules.filter(x=>x.id!==${r.id});save();render()">${ic('trash','sm')}</button></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">No plugin rules. Crea una desde aquí o desde el detalle de un plugin.</div>'}</div>`;}

function resetLab(){modal('Restablecer laboratorio','<p>Se borrarán scans, policies, reglas y el progreso de ejercicios de este navegador.</p>',`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="localStorage.removeItem(KEY);S=fresh();seed();save();closeModal();go({top:'scans',page:'scans',folder:'my'})">Restablecer</button>`);}

/* ===== Informes y exportación (generados localmente) ===== */
function download(name,mime,text){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function reportModal(id,fmt='html'){
 const active=UI.filters.filter(f=>f.value!=='').length;
 modal('Generate Report',`<div class="form"><div class="field"><label>Format</label><select class="in" id="rp-f" onchange="document.getElementById('rp-t').disabled=this.value==='csv'"><option value="pdf" disabled>PDF (no disponible offline)</option><option value="html" ${fmt==='html'?'selected':''}>HTML</option><option value="csv" ${fmt==='csv'?'selected':''}>CSV</option></select></div>
 <div class="field"><label>Report Template</label><select class="in" id="rp-t" ${fmt==='csv'?'disabled':''}><option value="exec">Executive Summary</option><option value="host">Detailed Vulnerabilities By Host</option><option value="plugin">Detailed Vulnerabilities By Plugin</option></select></div></div>
 <div class="st">${ic('filter','sm')}<span>${active?`Se aplicarán los <b>${active}</b> filtro(s) activos y las plugin rules.`:'Sin filtros activos: se incluyen todos los resultados (aplicando plugin rules).'}</span></div>`,
 `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="genReport(${id})">${ic('download','sm')}Generate Report</button>`);}
function genReport(id){
 const f=document.getElementById('rp-f').value,t=document.getElementById('rp-t').value;closeModal();
 const s=S.scans.find(x=>x.id===id),run=curRun(s);const items=applyFilters(effItems(run));
 if(f==='csv'){
  const cols=['Plugin ID','CVE','CVSS v3.0 Base Score','Risk','Host','Protocol','Port','Name','Synopsis','Solution','VPR Score','EPSS Score','Exploit Available','Plugin Output'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[cols.map(q).join(',')].concat(items.map(x=>{const [port,proto]=x.it.port.split('/');return[x.p.id,(x.p.cve||[]).join(','),x.p.cvss??'',x.sev?SEV[x.sev]:'None',x.h.ip,proto,port,x.p.name,x.p.syn,x.p.sol,x.p.vpr??'',x.p.epss??'',x.p.exploit,x.it.out.trim()].map(q).join(',');}));
  download(slug(s.name)+'.csv','text/csv;charset=utf-8','\ufeff'+lines.join('\r\n'));
  ev('reportCsv');if(UI.filters.some(f=>f.field==='vpr'&&f.op==='gt'&&parseFloat(f.value)>=6.9&&f.value!==''))ev('csvVPR');
  toast('CSV report generated','download');checkExercises();return;}
 download(slug(s.name)+'_'+t+'.html','text/html;charset=utf-8',htmlReport(s,run,items,t));
 if(t==='exec')ev('reportExec');ev('reportHtml');toast('HTML report generated','download');checkExercises();
}
function htmlReport(s,run,items,t){
 const c=counts(items.filter(x=>x.sev>0).length?items:items);const col=['#67ace1','#f8c851','#f18c43','#dd4b50','#91243e'];
 const agg=aggregate(items).sort((a,b)=>b.sev-a.sev||(b.p.vpr||0)-(a.p.vpr||0));
 const top=agg.filter(a=>a.sev>=3).slice(0,10);
 const sevB=x=>`<span style="background:${col[x]};color:${x===1||x===2?'#1d1206':'#fff'};padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600">${SEV[x]}</span>`;
 let body='';
 if(t==='exec'){
  body=`<h2>Executive Summary</h2><p>Scan <b>${esc(s.name)}</b> (${esc(tpl(s.template).name)}) · ${run.hosts.length} hosts · ${new Date(run.start).toLocaleString('es-ES')}.</p>
  <table><tr>${[4,3,2,1,0].map(i=>`<td style="text-align:center;background:${col[i]};color:${i===1||i===2?'#1d1206':'#fff'};padding:12px"><div style="font-size:26px;font-weight:700">${c[i]}</div>${SEV[i]}</td>`).join('')}</tr></table>
  <h3>Hosts</h3><table><tr><th>Host</th><th>Critical</th><th>High</th><th>Medium</th><th>Low</th><th>Info</th></tr>${run.hosts.map(h=>{const hc=counts(items.filter(x=>x.h.ip===h.ip));return`<tr><td>${h.ip} (${esc(h.fqdn)})</td>${[4,3,2,1,0].map(i=>`<td>${hc[i]}</td>`).join('')}</tr>`;}).join('')}</table>
  <h3>Top risks (Critical/High, ordenado por VPR)</h3><table><tr><th>Sev</th><th>VPR</th><th>CVSS</th><th>Name</th><th>Hosts</th></tr>${top.map(a=>`<tr><td>${sevB(a.sev)}</td><td>${fmt1(a.p.vpr)}</td><td>${fmt1(a.p.cvss)}</td><td>${esc(a.p.name)}</td><td>${[...a.hosts].join(', ')}</td></tr>`).join('')}</table>
  <h3>Remediations</h3><table><tr><th>Action</th><th>Vulns</th><th>Hosts</th></tr>${remediations(items).map(r=>`<tr><td>${esc(r.action)}</td><td>${r.pl.size}</td><td>${r.hosts.size}</td></tr>`).join('')}</table>`;
 }else if(t==='host'){
  body=run.hosts.map(h=>`<h2>${h.ip} <small>${esc(h.fqdn)} · ${esc(h.os)}</small></h2>`+items.filter(x=>x.h.ip===h.ip).sort((a,b)=>b.sev-a.sev).map(x=>`<div class="v"><h4>${sevB(x.sev)} ${x.p.id} - ${esc(x.p.name)}</h4><p><b>Synopsis:</b> ${esc(x.p.syn)}</p><p><b>Solution:</b> ${esc(x.p.sol)}</p><p><b>Risk:</b> CVSS v3.0 ${fmt1(x.p.cvss)} · VPR ${fmt1(x.p.vpr)} · ${x.p.cve.join(', ')}</p><p><b>Port:</b> ${esc(x.it.port)}</p><pre>${esc(x.it.out)}</pre></div>`).join('')).join('');
 }else{
  body=agg.map(a=>`<div class="v"><h4>${sevB(a.sev)} ${a.p.id} - ${esc(a.p.name)}</h4><p>${esc(a.p.desc)}</p><p><b>Solution:</b> ${esc(a.p.sol)}</p><p><b>CVSS v3.0:</b> ${fmt1(a.p.cvss)} ${esc(a.p.vector)} · <b>VPR:</b> ${fmt1(a.p.vpr)} · <b>CVE:</b> ${a.p.cve.join(', ')||'-'}</p><p><b>Hosts:</b> ${[...a.hosts].join(', ')}</p></div>`).join('');
 }
 return`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(s.name)} - Report</title><style>body{font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:#141c26;max-width:960px;margin:30px auto;padding:0 20px}h1{font-size:24px}table{border-collapse:collapse;width:100%;margin:10px 0 20px}td,th{border-bottom:1px solid #dde3ea;padding:7px 9px;text-align:left;font-size:13px}pre{background:#f4f6f8;padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px}.v{border-radius:10px;box-shadow:0 0 0 1px rgba(16,24,40,.1);padding:4px 16px;margin:10px 0}small{color:#38434f;font-weight:400;font-size:14px}.disc{color:#38434f;font-size:12px}</style></head><body>
 <h1>${esc(s.name)}</h1><p class="disc">Informe generado localmente por Vuln Scanner Lab (simulador de estudio no oficial). Datos ficticios de laboratorio. Plugin rules aplicadas.</p>${body}</body></html>`;
}
function exportNessus(id){
 const s=S.scans.find(x=>x.id===id),run=curRun(s);if(!run){toast('Nothing to export','info');return;}
 const x=v=>esc(v);
 const xml=`<?xml version="1.0" ?>\n<NessusClientData_v2>\n<Report name="${x(s.name)}">\n`+run.hosts.map(h=>`<ReportHost name="${h.ip}"><HostProperties><tag name="host-fqdn">${x(h.fqdn)}</tag><tag name="operating-system">${x(h.os)}</tag></HostProperties>\n`+h.items.map(it=>{const p=PLUGINS[it.pid];const [port,proto]=it.port.split('/');return`<ReportItem port="${port}" protocol="${proto}" severity="${p.sev}" pluginID="${p.id}" pluginName="${x(p.name)}" pluginFamily="${x(p.family)}"><risk_factor>${p.sev?SEV[p.sev]:'None'}</risk_factor>${p.cvss!=null?`<cvss3_base_score>${p.cvss}</cvss3_base_score>`:''}${p.vpr!=null?`<vpr_score>${p.vpr}</vpr_score>`:''}${(p.cve||[]).map(c=>`<cve>${c}</cve>`).join('')}<plugin_output>${x(it.out)}</plugin_output></ReportItem>`;}).join('\n')+`\n</ReportHost>`).join('\n')+`\n</Report>\n</NessusClientData_v2>\n`;
 download(slug(s.name)+'.nessus','application/xml',xml);ev('exportNessus');toast('.nessus exported (raw data: plugin rules not applied)','download');}

function exDone(e){return!!(S.prog[e.id]&&S.quiz[e.id]);}
function checkExercises(){
 let any=false;
 EXERCISES.forEach((e,i)=>{if(!S.prog[e.id]){let ok=false;try{ok=e.check();}catch(x){}if(ok){S.prog[e.id]=Date.now();any=true;toast(`Ejercicio ${i+1}: comprobación superada. Responde el quiz para completarlo.`);}}});
 if(any){save();renderTop();renderDrawer();}
}
let drawerOpen=false,drawerEx=null,drawerTab='ex';
function toggleDrawer(o){drawerOpen=o;document.getElementById('drawer').classList.toggle('open',o);if(o){checkExercises();renderDrawer();}}
function renderDrawer(){
 const el=document.getElementById('drawer');if(!el)return;
 const done=EXERCISES.filter(exDone).length;
 let body='';
 if(drawerTab==='guide')body=GUIDE;
 else if(drawerEx==null){
  body=`<div class="ovprog"><span class="num"><b>${done}</b> / ${EXERCISES.length}</span><div class="meter"><i style="width:${done/EXERCISES.length*100}%"></i></div></div>
  <div class="ex-list">${EXERCISES.map((e,i)=>`<button class="ex ${exDone(e)?'done':''}" onclick="drawerEx=${i};renderDrawer()"><span class="n">${exDone(e)?ic('check','sm'):i+1}</span><span><span class="lvl">${e.lvl}${S.prog[e.id]&&!S.quiz[e.id]?' · falta el quiz':''}</span><b>${e.title}</b></span></button>`).join('')}</div>`;
 }else{
  const e=EXERCISES[drawerEx],ok=!!S.prog[e.id],qd=!!S.quiz[e.id];
  body=`<button class="btn ghost sm" onclick="drawerEx=null;renderDrawer()">${ic('chevL','sm')}Todos los ejercicios</button>
  <div style="margin:10px 0 4px" class="lvl muted">Ejercicio ${drawerEx+1} · ${e.lvl}</div><h3 style="font-size:17px;margin-bottom:8px">${e.title}</h3>
  <p><b>Objetivo:</b> ${e.goal}</p><p class="muted">${e.why}</p><b>Pasos</b><ol class="steps">${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
  ${e.hints.map((h,i)=>`<details class="hint"><summary>Pista ${i+1}</summary><div style="margin-top:6px">${h}</div></details>`).join('')}
  <div class="st ${ok?'ok':''}">${ic(ok?'check':'clock','sm')}<span>${ok?'Comprobación automática superada':'Comprobación automática: pendiente (hazlo en el simulador)'}</span></div>
  <b style="display:block;margin-top:14px">Quiz</b><p style="margin:4px 0">${e.quiz.q}</p><div class="quiz" id="quiz">${e.quiz.o.map((o,i)=>`<label class="${qd&&i===e.quiz.a?'right':''}"><input type="radio" name="q" value="${i}" ${qd&&i===e.quiz.a?'checked':''}> <span>${o}</span></label>`).join('')}</div>
  <div id="qfb" style="margin-top:8px">${qd?`<div class="st ok">${ic('check','sm')}<span>Correcto. ${e.quiz.ex}</span></div>`:''}</div>
  <div style="display:flex;gap:8px;margin-top:12px">${qd?'':`<button class="btn primary" onclick="answer(${drawerEx})">Comprobar respuesta</button>`}${drawerEx<EXERCISES.length-1?`<button class="btn" onclick="drawerEx++;renderDrawer()">Siguiente ${ic('chevR','sm')}</button>`:''}</div>
  ${exDone(e)?`<div class="st ok" style="margin-top:12px">${ic('check','sm')}<span>Ejercicio completado</span></div>`:''}`;
 }
 el.innerHTML=`<header>${ic('book')}<h2>Entrenamiento</h2><span style="margin-left:auto"></span><button class="btn ghost sm" onclick="toggleDrawer(false)" aria-label="Cerrar">${ic('x','sm')}</button></header>
 <div class="tabs" style="padding:0 14px"><button class="tab" aria-selected="${drawerTab==='ex'}" onclick="drawerTab='ex';renderDrawer()">Ejercicios</button><button class="tab" aria-selected="${drawerTab==='guide'}" onclick="drawerTab='guide';renderDrawer()">Guía rápida</button></div><div class="db">${body}</div>`;
}
function answer(i){const e=EXERCISES[i];const c=document.querySelector('#quiz input:checked');const fb=document.getElementById('qfb');
 if(!c){fb.innerHTML='<div class="st">Elige una respuesta.</div>';return;}
 document.querySelectorAll('#quiz label').forEach(l=>l.classList.remove('right','wrong'));
 if(+c.value===e.quiz.a){S.quiz[e.id]=Date.now();save();renderTop();renderDrawer();if(!S.prog[e.id])toast('Quiz correcto. Falta completar la práctica en el simulador.','info');}
 else{c.closest('label').classList.add('wrong');fb.innerHTML=`<div class="st">${ic('x','sm')}<span>No es correcta. Vuelve a leer el “por qué” del ejercicio y prueba otra vez.</span></div>`;}}
const GUIDE=`<h3 style="font-size:15px">Conceptos clave</h3>
<p><b>Severity</b>: Critical (CVSS 9.0–10), High (7.0–8.9), Medium (4.0–6.9), Low (0.1–3.9), Info (sin riesgo, datos de inventario).</p>
<p><b>CVSS v3.0 Base Score</b>: gravedad técnica intrínseca (vector AV/AC/PR/UI/S/C/I/A). No cambia con el tiempo.</p>
<p><b>VPR</b> (Vulnerability Priority Rating, 0.1–10): métrica dinámica de Tenable que combina impacto con inteligencia de amenazas (exploits, actividad reciente, antigüedad). Los plugins sin CVE (configuración, unsupported) no tienen VPR.</p>
<p><b>EPSS</b>: probabilidad estimada de explotación en los próximos 30 días (0–1).</p>
<p><b>Remote vs local</b>: remote = desde la red (banners, respuestas); local = con credenciales (paquetes, registro, archivos). Los chequeos por banner pueden dar falsos positivos por backports.</p>
<p><b>Plugin Rules</b>: cambian severidad u ocultan resultados tras el escaneo. Úsalas con host concreto, comentario y caducidad. No afectan al .nessus.</p>
<p><b>Policies</b>: plantillas propias reutilizables (ajustes + credenciales).</p>
<p><b>Essentials</b>: 16 IPs, sin plantillas de Compliance, un usuario.</p>
<h3 style="font-size:15px;margin-top:14px">Flujo de trabajo VM</h3><ol class="steps"><li>Descubrir activos (Host Discovery).</li><li>Evaluar (Basic/Advanced con credenciales).</li><li>Priorizar (VPR, exploit, KEV, criticidad del activo).</li><li>Remediar (Remediations, tickets con SLA).</li><li>Validar (re-escaneo, History).</li><li>Reportar (Executive Summary, CSV).</li></ol>
<p class="muted" style="font-size:12.5px">Simulador de estudio no oficial, no afiliado a Tenable. Nessus y Tenable son marcas de sus propietarios. Datos, IDs y puntuaciones son representativos con fines formativos.</p>`;

/* ===== Datos de ejemplo e inicio ===== */
function seed(){
 const s={id:uid(),name:'Ejemplo - web01 (sin credenciales)',template:'basic',policyId:null,settings:{...defaultSettings('basic'),targets:'192.168.56.30',desc:'Scan de ejemplo precargado'},creds:defaultCreds(),folder:'my',runs:[],cur:null,mod:Date.now()};
 const hosts=genResults(s,['192.168.56.30']);const st=Date.now()-36e5*20;
 s.runs.push({id:uid(),start:st,end:st+9*60000,status:'completed',progress:100,dur:1,simMs:9*60000,ips:1,hosts,cred:{ssh:'none',win:'none'}});s.cur=s.runs[0].id;S.scans.push(s);
}
function init(){
 S=load();if(!S){S=fresh();seed();save();}
 S.scans.forEach(s=>s.runs.forEach(r=>{if(r.status==='running'||r.status==='paused'){r.status='completed';r.progress=100;r.end=r.start+r.simMs;}}));
 render();checkExercises();
}
init();
</script>
